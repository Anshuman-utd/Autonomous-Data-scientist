version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: autonomous_ds_db
    restart: always
    environment:
      POSTGRES_DB: data_scientist_db
      POSTGRES_USER: ds_user
      POSTGRES_PASSWORD: ds_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ds_user -d data_scientist_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autonomous_ds_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autonomous_ds_backend
    restart: always
    environment:
      DEBUG: "False"
      SECRET_KEY: "production-deploy-key-autonomous-ai-data-scientist"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend,frontend"
      DATABASE_URL: "postgres://ds_user:ds_secure_password@db:5432/data_scientist_db"
      REDIS_URL: "redis://redis:6379/1"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      USE_REDIS_CACHE: "True"
      CELERY_ALWAYS_EAGER: "False"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000"
    ports:
      - "8000:8000"
    volumes:
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autonomous_ds_celery_worker
    restart: always
    command: celery -A core worker -l info --concurrency=2
    environment:
      DEBUG: "False"
      SECRET_KEY: "production-deploy-key-autonomous-ai-data-scientist"
      DATABASE_URL: "postgres://ds_user:ds_secure_password@db:5432/data_scientist_db"
      REDIS_URL: "redis://redis:6379/1"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    volumes:
      - backend_media:/app/media
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autonomous_ds_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_media:
